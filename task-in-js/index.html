<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="root">
        <div class="form">
            <br>
            <h1 style="text-align: center;">Stack Manage</h1>
            <br><br>
            <div class="group">
                <input type="text" class="input-value" id="input-value" name="input-value" placeholder="Enter Element">
            </div>
            <br>
            <div class="group">
                <button onclick="pushValue()">Push</button>
                <button onclick="popValue()">Pop</button>
            </div>
        </div>
        <div class="stack">
            <div class="stack-box"></div>
        </div>
    </div>
</body>
<script src="index.js"></script>

</html>
