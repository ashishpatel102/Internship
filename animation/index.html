<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Shadow Using CSS</title>
    <style>
        body {
            margin: 0;
        }

        .boxs {
            position: relative;
            height: 100vh;
            place-content: center;
            gap: 10px;
            perspective: 1000px;
            overflow: hidden;
            overflow-x: auto;
            white-space: nowrap;
        }


        .main-scroll {
            position: relative;
        }

        .main-scroll .scroll {
            position: sticky;
            top: 70%;
            left: 50%;
            z-index: 100;
            text-align: center;

            span {
                display: inline-block;
                width: 15px;
                height: 15px;
                background: rgb(199, 199, 199);
                border-radius: 50%;
                margin: 3px;
                cursor: pointer;
            }
        }

        .box1,
        .box2 {
            --img: url('https://i.pinimg.com/736x/c4/6a/91/c46a91a5fbd77d101529679ff4382dfc.jpg');

            position: relative;
            background-image: var(--img);
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            transform: rotateY(calc(var(--i)*60deg));
            cursor: pointer;
            display: inline-block;
            width: 200px;
            height: 200px;
            margin-right: 10px;
            animation: scroll 10s linear infinite;
        }

        .box1::after,
        .box2::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: var(--img);
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            filter: blur(2px);
            transform: scaleY(-1);
            z-index: -1;
            border-radius: 20px;
        }

        .box1:hover::after,
        .box2:hover::after {
            opacity: 0.3;
            filter: blur(1px);
            cursor: pointer;

        }

        @media (max-width:750px) {

            .box1,
            .box2 {
                transform: rotate(0);
            }
        }
    </style>
</head>

<body>

    <div class="main-scroll">
        <div class="scroll">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="boxs">

            <div class="box1"
                style="--i:1; --img: url('https://i.pinimg.com/736x/c4/6a/91/c46a91a5fbd77d101529679ff4382dfc.jpg')">
            </div>
            <div class="box1"
                style=" --i:1; --img: url('https://i.pinimg.com/736x/08/29/50/0829505131ca95758fa7af48b1f29b4f.jpg')">
            </div>
            <div class="box1"
                style="--i:1; --img: url('https://i.pinimg.com/1200x/6a/e1/e2/6ae1e2f04ca8a5c2e7bded6416da94e1.jpg')">
            </div>
            <div class="box1"
                style="--i:0; --img: url('https://i.pinimg.com/736x/fc/75/af/fc75af7f66199429850d1fb947191099.jpg')">
            </div>
            <div class="box2"
                style="--i:2; --img: url('https://i.pinimg.com/736x/92/25/0e/92250e8e7fd8088def70e4f8b5380dea.jpg')">
            </div>
            <div class="box2"
                style="--i:2; --img: url('https://i.pinimg.com/736x/52/06/ee/5206ee5c8a74e83f2b0b7e20b6cfc92b.jpg')">
            </div>
            <div class="box2"
                style="--i:2; --img: url('https://i.pinimg.com/736x/fe/58/20/fe58207b7b1a312cf6cc67050e3e5397.jpg')">
            </div>

        </div>
    </div>



</body>

</html>
