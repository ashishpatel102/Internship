<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Game Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('https://i.pinimg.com/736x/b5/90/0e/b5900e1d9bb72a5d420ca9baef697635.jpg');
            background-size: auto 100%;
            background-repeat: repeat-x;
            background-position: 100% -11%;
            animation: backgroundMove 28s linear infinite;
        }

        @keyframes backgroundMove {
            0% {
                background-position-x: 2000%;
            }

            100% {
                background-position-x: 0%;
            }
        }

        .player {
            position: absolute;
            bottom: 20px;
            left: 30%;
            width: 105px;
            height: 170px;
            background-image: url('./game.png');
            background-repeat: no-repeat;
            background-size: 920px 850px;
            background-position: 0 27%;
            animation: runPlayer 1s steps(12) infinite;
        }

        .player.pause {
            background-position: 0 80%;
            animation: none;
        }

        @keyframes runPlayer {
            100% {
                background-position-x: 100%;
            }
        }

        @media (max-width: 576px) {
            .player {
                transform: scale(0.7);
                left: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="player"></div>
    </div>
</body>

</html>
